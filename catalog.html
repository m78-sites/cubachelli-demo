<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог Cubachelli — опт</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234a1b17'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='38' fill='%23f3e9dc' text-anchor='middle'%3Ec%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:'Lora';font-weight:400;font-display:swap;src:url(fonts/lora-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:'Lora';font-weight:400;font-display:swap;src:url(fonts/lora-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Lora';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/lora-cyrillic-400-italic.woff2) format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:'Lora';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/lora-latin-400-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Mulish';font-weight:400;font-display:swap;src:url(fonts/mulish-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:'Mulish';font-weight:400;font-display:swap;src:url(fonts/mulish-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Mulish';font-weight:700;font-display:swap;src:url(fonts/mulish-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:'Mulish';font-weight:700;font-display:swap;src:url(fonts/mulish-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--cream:#f6efe6;--paper:#fffaf4;--ink:#2a1411;--muted:#6c534d;--bordo:#4a1b17;--bordo-2:#5b241f;--on:#f3e9dc;--kraft:#e8d4b9;--line:rgba(42,20,17,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 'Mulish',system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
h1,h2{font-family:'Lora',Georgia,serif;font-weight:400;margin:0;line-height:1.1}
.bar{position:sticky;top:0;z-index:2;display:flex;justify-content:center;gap:12px;padding:12px;background:var(--bordo);color:var(--on);font-size:14px}
.bar button{font:inherit;font-weight:700;padding:10px 20px;border:0;border-radius:99px;background:var(--on);color:var(--bordo);cursor:pointer}
.page{max-width:900px;margin:0 auto;padding:32px 20px 48px}
.cover{display:grid;gap:14px;padding:36px 32px;border-radius:22px;background:var(--bordo);color:var(--on)}
.logo{display:flex;align-items:center;height:40px}
.logo i{display:block;background:currentColor}
.logo .m{width:46px;height:50px;margin-right:-16px;opacity:.5;-webkit-mask:url(img/mark.png) center/contain no-repeat;mask:url(img/mark.png) center/contain no-repeat}
.logo .w{height:100%;aspect-ratio:828/149;-webkit-mask:url(img/wordmark.png) center/contain no-repeat;mask:url(img/wordmark.png) center/contain no-repeat}
.cover h1{font-size:38px;margin-top:12px}
.cover h1 em{color:#e8b383}
.cover p{color:#d3bcb0;max-width:40em}
.cover ul{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.cover li{padding:6px 14px;border-radius:99px;border:1px solid rgba(243,233,220,.3);font-size:13px}
.grp{margin-top:36px;break-inside:auto}
.grp h2{font-size:32px}
.grp > p{color:var(--muted);margin:4px 0 14px}
table{width:100%;border-collapse:collapse;background:var(--paper);border-radius:16px;overflow:hidden}
th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr{break-inside:avoid}
td.pic{width:84px}
.pic span{display:grid;place-items:center;width:68px;height:68px;border-radius:12px;background:var(--kraft)}
.pic img{max-width:56px;max-height:56px}
.pic .tile{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:italic 11px 'Lora',serif}
.name{font-family:'Lora',serif;font-size:16.5px;line-height:1.25}
.name small{display:block;font-family:'Mulish',sans-serif;font-size:12.5px;color:var(--muted);margin-top:3px}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
td.p{font-weight:700;white-space:nowrap;text-align:right}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
@media (max-width:640px){.hide-m{display:none}.cover{padding:28px 20px}.cover h1{font-size:30px}td,th{padding:10px 8px}td.pic{width:64px}.pic span{width:52px;height:52px}.pic img{max-width:44px;max-height:44px}.pic .tile{width:42px;height:42px;font-size:9px}.name{font-size:15px}}
@media print{
  @page{size:A4;margin:12mm}
  .bar{display:none}
  .page{padding:0;max-width:none}
  body{font-size:12.5px}
  .hide-m{display:table-cell!important}
}
</style>
</head>
<body>
<div class="bar">Каталог для оптовиков <button type="button" onclick="print()">Сохранить в PDF</button></div>
<div class="page">
  <section class="cover">
    <div class="logo" aria-label="cubachelli"><i class="m"></i><i class="w"></i></div>
    <h1>Пахлава, печенье и мармелад <em>оптом</em></h1>
    <p>Кондитерский цех в Балашихе, ООО «БФК». Поставляем во ВкусВилл, Яндекс Лавку и на Озон. Цены — отпускные, за штуку, с НДС 22%.</p>
    <ul><li>Короб от 4 шт</li><li>Срок до 90 суток</li><li>Крафт-упаковка с окном</li><li>Работаем под маркой сети</li></ul>
  </section>
  <div id="list"></div>
  <p class="foot" id="foot"></p>
</div>
<script src="js/data.js?v=4"></script>
<script>
(function(){
  var D = window.CB_DATA;
  function money(n){ var w = Math.abs(n % 1) < .005; return n.toLocaleString('ru-RU',{minimumFractionDigits:w?0:2,maximumFractionDigits:2}) + ' ₽'; }
  document.getElementById('list').innerHTML = D.groups.map(function(g){
    var rows = D.products.filter(function(p){ return p.group === g.id; }).map(function(p){
      var pic = p.img ? '<img src="'+p.img+'" alt="">' : '<span class="tile" style="background:'+p.tile.bg+';color:'+p.tile.ink+'">'+p.tile.word+'</span>';
      return '<tr><td class="pic"><span>'+pic+'</span></td>'+
        '<td><div class="name">'+p.name+(p.sub?', '+p.sub:'')+'<small>'+p.weight+', '+(p.box? p.box+' шт в коробе, ':'')+p.shelf+', '+p.channel+(false?' · '+p.kbju:'')+'</small></div></td>'+
        '<td class="n hide-m">'+p.weight+'</td><td class="n hide-m">'+(p.box? p.box+' шт':'—')+'</td><td class="n hide-m">'+p.shelf+'</td>'+
        '<td class="p">'+(p.price? money(p.price):'по запросу')+'</td></tr>';
    }).join('');
    return '<section class="grp"><h2>'+g.name+'</h2><p>'+g.note+'</p><table><thead><tr><th></th><th>Позиция</th><th class="hide-m">Вес</th><th class="hide-m">Короб</th><th class="hide-m">Срок</th><th style="text-align:right">Цена / шт</th></tr></thead><tbody>'+rows+'</tbody></table></section>';
  }).join('');
  document.getElementById('foot').textContent = 'Данные из продуктовой линейки от ' + D.updated + '. Составы полностью — на сайте в карточке товара. Демо-каталог, М78.';
})();
</script>
</body>
</html>
