<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог Cubachelli — опт</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css?v=1">
<style>
  /* Каталог для печати и PDF: собирается из того же data.js, что и сайт */
  body{background:#e9e2d7}
  .sheet{max-width:820px;margin:var(--s6) auto;background:var(--paper);box-shadow:var(--sh-2);padding:var(--s7) var(--s7) var(--s6)}
  .cat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s5);padding-bottom:var(--s5);border-bottom:2px solid var(--ink);margin-bottom:var(--s5)}
  .cat-logo{background:var(--wine);padding:var(--s3) var(--s4);border-radius:0 0 10px 10px;margin-top:calc(-1 * var(--s7))}
  .cat-logo img{height:34px;width:auto}
  .cat-head h1{font-size:30px;line-height:1.1;margin-bottom:var(--s2)}
  .cat-head p{font:400 12px/1.5 var(--f-mono);color:var(--muted)}
  .cat-group{margin-top:var(--s6);break-inside:avoid-page}
  .cat-group h2{font-size:24px;display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s2)}
  .cat-group h2 small{font:400 12px/1.4 var(--f-mono);color:var(--muted);letter-spacing:0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font:500 12px/1.2 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:var(--s2) var(--s2) var(--s2) 0;border-bottom:1px solid var(--line)}
  td{padding:var(--s3) var(--s2) var(--s3) 0;border-bottom:1px solid var(--line);vertical-align:top}
  td.n{font:500 14px/1.3 var(--f-display)} td.n small{display:block;font:400 12px/1.4 var(--f-text);color:var(--muted)}
  td.m{font:400 13px/1.3 var(--f-mono);white-space:nowrap}
  .cat-foot{margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line);font:400 12px/1.5 var(--f-mono);color:var(--muted)}
  .bar{position:sticky;top:0;z-index:5;display:flex;gap:var(--s3);justify-content:center;padding:var(--s3);background:rgba(233,226,215,.92);backdrop-filter:blur(8px)}
  @media (max-width:640px){.sheet{margin:0;padding:var(--s7) var(--s4) var(--s5)} td.hide-s,th.hide-s{display:none}}
  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff}.bar{display:none}.sheet{box-shadow:none;margin:0;max-width:none;padding:0}
    .cat-logo{margin-top:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="bar"><button class="btn btn--small" type="button" onclick="print()">Сохранить в PDF</button><a class="btn btn--small btn--ghost" href="index.html#zayavka">Оставить заявку</a></div>
<main class="sheet">
  <header class="cat-head">
    <div>
      <h1>Каталог для оптовых покупателей</h1>
      <p>Кондитерский цех Cubachelli · Балашиха<br>ВкусВилл · Яндекс Лавка · Озон<br>Обновлено <span data-updated></span></p>
    </div>
    <div class="cat-logo"><img src="img/logo-cubachelli.webp" width="977" height="382" alt="Cubachelli"></div>
  </header>
  <div id="cat"></div>
  <p class="cat-foot">Цены — отпускные за штуку с НДС 22%, демо по таблице клиента. Минимальная партия и доставка — по запросу. Составы — по этикеткам, КБЖУ на 100 г.</p>
</main>
<script src="js/data.js?v=2"></script>
<script>
(() => {
  const D = window.CB_DATA, esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const rub = n => n ? n.toLocaleString('ru-RU',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}) + ' ₽' : 'по запросу';
  document.querySelectorAll('[data-updated]').forEach(e => e.textContent = D.updated);
  document.getElementById('cat').innerHTML = D.groups.map(g => {
    const rows = D.products.filter(p => p.group === g.id).map(p => `<tr>
      <td class="n">${esc(p.name)}${p.sub ? `<small>${esc(p.sub)}</small>` : ''}</td>
      <td class="m">${esc(p.weight)}</td><td class="m">${p.box ? p.box + ' шт' : '—'}</td><td class="m">${esc(p.shelf)}</td>
      <td class="m hide-s">${esc(p.kbju ? p.kbju.split(' · ').pop() : '—')}</td><td class="m">${rub(p.price)}</td></tr>`).join('');
    return `<section class="cat-group"><h2>${esc(g.name)} <small>${esc(g.note)}</small></h2>
      <table><thead><tr><th>Позиция</th><th>Вес</th><th>Короб</th><th>Срок</th><th class="hide-s">ккал</th><th>Цена/шт</th></tr></thead><tbody>${rows}</tbody></table></section>`;
  }).join('');
})();
</script>
</body>
</html>
